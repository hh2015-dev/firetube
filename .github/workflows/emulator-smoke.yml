name: Free Android emulator smoke (private original APKs)
on:
  push:
    branches: [test/drive-offline-upgrade-regression-20261102]
    paths:
      - '.github/workflows/emulator-smoke.yml'
      - 'tools/emulator-smoke/**'
permissions:
  contents: read
jobs:
  emulator-smoke:
    if: github.repository == 'hh2015-dev/firetube' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare ephemeral private APK receiver
        run: |
          python -m pip install --disable-pip-version-check 'cryptography==46.0.4'
          python tools/emulator-smoke/private_input.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: emulator-public-recipient-${{ github.run_id }}
          path: public-recipient/
          retention-days: 1
      - name: Receive existing APKs without public links or signing secrets
        run: python tools/emulator-smoke/private_input.py receive
      - name: Enable KVM access for standard free Linux runner
        run: |
          test -c /dev/kvm
          sudo chown "$USER" /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Locate Android signature and manifest tools
        run: |
          TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -x "$TOOLS/apksigner"
          test -x "$TOOLS/aapt"
          echo "$TOOLS" >> "$GITHUB_PATH"
      - name: Boot Google Play emulator and run actual smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis_playstore
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -camera-front none
          script: python tools/emulator-smoke/smoke.py
      - name: Publish text-only test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke-result
          path: smoke-report/result.json
          if-no-files-found: warn
          retention-days: 1
      - name: Remove runner-only private input
        if: always()
        run: rm -rf "$RUNNER_TEMP/firetube-private"
