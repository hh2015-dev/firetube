name: Private side-by-side Favorites counters APK
on:
  push:
    branches: [dev/favorites-counters-side-by-side-20261102]
permissions:
  contents: read
concurrency:
  group: favorites-counters-side-by-side-test
  cancel-in-progress: true
jobs:
  test-build:
    if: github.repository == 'hh2015-dev/firetube'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: '215'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Unit tests, reactive UI tests, Lint and Debug APK
        run: ./gradlew :core:extractor:test testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace
      - name: Record tests, package and actual signature
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p secure-output
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > secure-output/signature.txt
          "$BUILD_TOOLS/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > secure-output/badging.txt
          grep -F "package: name='com.palmerintech.firetube.drivefavoritescounterspreview' versionCode='215'" secure-output/badging.txt
          grep -F "application-label:'FireTube Counters Test'" secure-output/badging.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk > secure-output/apk-sha256.txt
          stat --printf='%s\n' app/build/outputs/apk/debug/app-debug.apk > secure-output/apk-size.txt
          git rev-parse HEAD > secure-output/source-commit.txt
          cat secure-output/signature.txt
          python - <<'PY'
          import pathlib,json,xml.etree.ElementTree as E
          suites=[E.parse(p).getroot() for p in pathlib.Path('.').glob('**/build/test-results/**/TEST-*.xml')]
          summary={k:sum(int(s.attrib.get(k,0)) for s in suites) for k in ['tests','failures','errors','skipped']}
          summary['counter_tests']=[c.attrib.get('classname','')+'.'+c.attrib['name'] for s in suites for c in s.findall('testcase') if 'FavoriteCounts' in c.attrib.get('classname','')]
          sarif=json.loads(pathlib.Path('app/build/reports/lint-results-debug.sarif').read_text())
          results=[r for run in sarif['runs'] for r in run.get('results',[])]
          summary['lint_errors']=sum(r.get('level')=='error' for r in results)
          summary['lint_warnings']=sum(r.get('level','warning')=='warning' for r in results)
          pathlib.Path('secure-output/tests.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          assert summary['failures']==summary['errors']==summary['lint_errors']==0
          assert len(summary['counter_tests'])==9
          PY
      - name: Encrypt private APK; never upload plaintext
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/delivery-public.pem" <<'PUBLICKEY'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAkJo5JCBULOmVr3MoX6du
          JOlliYZrQXTvIxiYwpW5JCXMllsnnjDSDDoegaln1pjHXqv6++A6ikEGUA0oU4q5
          /3HXjHybXqkuqKjONN8MhU/WkxCnvFMVy0DWdtwn8IZB57LmmUHQuLPkKVQTBglW
          N8pbA9NjJJtJNt28lT1QNCefqxVy4ZDHF1R5SWFSu0wYjlFhV2oujJFc6stLJr4d
          Moydf243Lc3BV1DzM8hH5sPY9NLVd2FicmlfLAqdhrYjt0HDiTbfPZHhbApJKzP3
          wCwHul6oMK9ulo7MmRolHmNfWhcU05SvN7L6PIkLYeJLQRbad1kl3F5VVR3TVWX+
          ggFV+MtwwG1js/h3GXbxfx/Kj441X+Inbkv/NP+Y1DzuRfpo4HVWJcgThFQN0BJF
          TPB4f48cg/TJKlEHSnvBL4bvgvDeXMR8nu+vPTHXhMO1hQ/QnmrvbclxuW+BZzFc
          CLs+8ACqgzMaX7ivafE77k6oay+pW4E/RQbJqy/NU9EJAgMBAAE=
          -----END PUBLIC KEY-----
          PUBLICKEY
          python -m pip install --no-cache-dir 'cryptography==46.0.4'
          python tools/private-apk/encrypt_apk.py app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/delivery-public.pem" secure-output/FireTube-Counters-SideBySide-Test.apk.enc
          # Preserve the new signing key only as authenticated ciphertext.
          # It is never placed in the repository, Drive, or plaintext artifacts.
          python - <<'PYKEY'
          import os,struct,pathlib
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          home=pathlib.Path.home()
          source=home/'.android/debug.keystore'
          assert source.is_file()
          public=serialization.load_pem_public_key(pathlib.Path(os.environ['RUNNER_TEMP'],'delivery-public.pem').read_bytes())
          key=AESGCM.generate_key(bit_length=256);nonce=os.urandom(12)
          wrapped=public.encrypt(key,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          ciphertext=AESGCM(key).encrypt(nonce,source.read_bytes(),b'FireTube personal APK transfer v1')
          pathlib.Path('secure-output/signing-key.keystore.enc').write_bytes(b'FIRETUBE_ENCRYPTED_APK_V1\n'+struct.pack('>H',len(wrapped))+wrapped+nonce+ciphertext)
          PYKEY
          rm -f app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: favorites-counters-side-by-side-encrypted
          path: secure-output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
