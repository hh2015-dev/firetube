# Only compile and test this experimental personal-use branch.
# No publish, no APK upload, no Google services credentials or paid API.
name: Personal SoundCloud widget verification

on:
  push:
    branches:
      - dev/soundcloud-widget

permissions:
  contents: read

concurrency:
  group: personal-soundcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: github.repository == 'hh2015-dev/firetube' && github.ref == 'refs/heads/dev/soundcloud-widget'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK, unit tests, and lint
        run: ./gradlew :core:extractor:test testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace
      - name: Verify APK was built without publication
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          echo "APK size: $(wc -c < "$apk") bytes"
          sha256sum "$apk"
          echo "APK built on runner and not uploaded or published." >> "$GITHUB_STEP_SUMMARY"
