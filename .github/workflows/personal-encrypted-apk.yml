name: Private encrypted offline preview APK (free public runner)

on:
  push:
    branches: [dev/offline-apk-test]

permissions:
  contents: read

concurrency:
  group: firetube-offline-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  encrypted-debug-apk:
    if: github.repository == 'hh2015-dev/firetube' && github.ref == 'refs/heads/dev/offline-apk-test'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test using free public standard runner
        run: ./gradlew :core:extractor:test testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace

      - name: Authenticated-encrypt APK before leaving build runner
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -m pip install --no-cache-dir 'cryptography==46.0.4'
          python tools/private-apk/encrypt_apk.py \
            app/build/outputs/apk/debug/app-debug.apk \
            tools/private-apk/transport-public-key-offline-preview.pem \
            secure-output/FireTube-offline-preview.apk.enc
          test -s secure-output/FireTube-offline-preview.apk.enc
          rm -f app/build/outputs/apk/debug/app-debug.apk
          echo "Only AES-256-GCM ciphertext will be transferred." >> "$GITHUB_STEP_SUMMARY"

      - name: Transfer encrypted bytes only, expire in one day
        uses: actions/upload-artifact@v4
        with:
          name: firetube-offline-preview-encrypted
          path: secure-output/FireTube-offline-preview.apk.enc
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
